<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark Space Glow -->
    <radialGradient id="tardis-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    
    <!-- TARDIS Midnight Blue Gradient -->
    <linearGradient id="tardis-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Roof Lamp -->
    <radialGradient id="lamp-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Sign Banner -->
    <linearGradient id="sign-banner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Window Glow -->
    <linearGradient id="window-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#tardis-glow)"/>

  <!-- Top Roof Lamp Light Cone -->
  <ellipse cx="32" cy="7" rx="6" ry="6" fill="url(#lamp-light)"/>
  <rect x="30.5" y="4" width="3" height="4" rx="1" fill="#e0f2fe"/>
  <rect x="29.5" y="7" width="5" height="1.5" rx="0.5" fill="#0284c7"/>

  <!-- TARDIS Roof Tier 1 (Trapezoid Roof Cap) -->
  <path d="M 22 13 L 42 13 L 45 18 L 19 18 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>

  <!-- Police Call Box Header Sign Banner -->
  <rect x="18" y="18" width="28" height="5" rx="0.8" fill="url(#sign-banner)" stroke="#38bdf8" stroke-width="0.8"/>
  <rect x="20" y="19.5" width="24" height="2" fill="#020617"/>
  <text x="32" y="21.1" font-family="sans-serif" font-weight="900" font-size="1.6" fill="#38bdf8" text-anchor="middle" letter-spacing="0.4">POLICE BOX</text>

  <!-- Main TARDIS Outer Cabinet Body -->
  <rect x="19" y="23" width="26" height="37" rx="1" fill="url(#tardis-body)" stroke="#1e293b" stroke-width="1"/>
  <line x1="32" y1="23" x2="32" y2="60" stroke="#020617" stroke-width="1.2"/>

  <!-- Corner Pillars -->
  <rect x="17.5" y="23" width="2.5" height="37" fill="#0f172a" stroke="#38bdf8" stroke-width="0.5"/>
  <rect x="44" y="23" width="2.5" height="37" fill="#0f172a" stroke="#38bdf8" stroke-width="0.5"/>

  <!-- Left Door Window Panes (Glowing Cyan / White) -->
  <rect x="21" y="25" width="9.5" height="7" rx="0.5" fill="#020617" stroke="#38bdf8" stroke-width="0.6"/>
  <rect x="22" y="26" width="3.5" height="2.2" fill="url(#window-glow)"/>
  <rect x="26" y="26" width="3.5" height="2.2" fill="url(#window-glow)"/>
  <rect x="22" y="29" width="3.5" height="2.2" fill="url(#window-glow)"/>
  <rect x="26" y="29" width="3.5" height="2.2" fill="url(#window-glow)"/>

  <!-- Right Door Window Panes (Glowing Cyan / White) -->
  <rect x="33.5" y="25" width="9.5" height="7" rx="0.5" fill="#020617" stroke="#38bdf8" stroke-width="0.6"/>
  <rect x="34.5" y="26" width="3.5" height="2.2" fill="url(#window-glow)"/>
  <rect x="38.5" y="26" width="3.5" height="2.2" fill="url(#window-glow)"/>
  <rect x="34.5" y="29" width="3.5" height="2.2" fill="url(#window-glow)"/>
  <rect x="38.5" y="29" width="3.5" height="2.2" fill="url(#window-glow)"/>

  <!-- Left Door Middle Panel (Notice Sign Panel) -->
  <rect x="21" y="34" width="9.5" height="7" rx="0.5" fill="#020617" stroke="#1e293b" stroke-width="0.6"/>
  <rect x="22" y="35" width="7.5" height="5" fill="#f8fafc" opacity="0.9"/>
  <line x1="23" y1="36.5" x2="28.5" y2="36.5" stroke="#020617" stroke-width="0.5"/>
  <line x1="23" y1="38" x2="28.5" y2="38" stroke="#020617" stroke-width="0.5"/>

  <!-- Right Door Middle Panel -->
  <rect x="33.5" y="34" width="9.5" height="7" rx="0.5" fill="#020617" stroke="#1e293b" stroke-width="0.6"/>

  <!-- Left Door Lower Panels -->
  <rect x="21" y="43" width="9.5" height="7" rx="0.5" fill="#020617" stroke="#1e293b" stroke-width="0.6"/>
  <rect x="21" y="51" width="9.5" height="7" rx="0.5" fill="#020617" stroke="#1e293b" stroke-width="0.6"/>

  <!-- Right Door Lower Panels -->
  <rect x="33.5" y="43" width="9.5" height="7" rx="0.5" fill="#020617" stroke="#1e293b" stroke-width="0.6"/>
  <rect x="33.5" y="51" width="9.5" height="7" rx="0.5" fill="#020617" stroke="#1e293b" stroke-width="0.6"/>

  <!-- Door Handle & Keyhole -->
  <circle cx="31" cy="42" r="0.7" fill="#fbbf24"/>
  <rect x="30.6" y="42" width="0.8" height="2" fill="#fbbf24"/>

  <!-- Base Steps -->
  <rect x="16" y="60" width="32" height="3" rx="0.8" fill="#0f172a" stroke="#38bdf8" stroke-width="0.6"/>
</svg>